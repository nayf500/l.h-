<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة سعودية قابلة للتعديل</title>
<style>
body{font-family:Tahoma,Arial;background:#eee;margin:0;padding:25px;text-align:center}
.wrap{max-width:650px;margin:auto;background:white;padding:20px;border-radius:14px}
.plate{width:100%;max-width:520px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px auto;max-width:520px}
label{text-align:right;font-weight:bold;font-size:13px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:7px;margin-top:5px;text-align:center}
button{padding:11px 18px;border:0;border-radius:8px;background:#087549;color:white;font-weight:bold}
</style></head>
<body><div class="wrap">
<h2>لوحة سعودية قابلة للتعديل</h2>
<svg id="plate" class="plate" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110">
<defs><linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eeeeec"/></linearGradient></defs>
<rect x="2" y="2" width="516" height="106" rx="6" fill="url(#plate)" stroke="#777" stroke-width="3"/>
<line x1="345" y1="3" x2="345" y2="107" stroke="#777"/><line x1="105" y1="3" x2="105" y2="107" stroke="#777"/>
<text id="arabic-numbers" x="52" y="53" text-anchor="middle" font-family="Tahoma,Arial" font-size="30" font-weight="700">٨٨٤</text>
<text id="latin-numbers" x="52" y="82" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">884</text>
<g transform="translate(225 24)" fill="#111"><path d="M0 27C-10 19-18 18-25 20C-18 13-8 13 0 17C-6 8-5 2 0 0C5 2 6 8 0 17C8 13 18 13 25 20C18 18 10 19 0 27Z"/><path d="M-28 31L-3 23L-1 27L-25 35ZM28 31L3 23L1 27L25 35Z"/><rect x="-1.5" y="25" width="3" height="12" rx="1"/></g>
<text x="225" y="69" text-anchor="middle" font-family="Tahoma,Arial" font-size="9" font-weight="700">السعودية</text><text x="225" y="83" text-anchor="middle" font-family="Arial" font-size="8">KSA</text>
<text id="arabic-letters" x="423" y="53" text-anchor="middle" font-family="Tahoma,Arial" font-size="30" font-weight="700">ع ع ب</text>
<text id="latin-letters" x="423" y="82" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" letter-spacing="3">BEV</text>
</svg>
<div class="grid">
<label>الحروف العربية<input id="ar" value="ع ع ب"></label>
<label>الأرقام<input id="num" value="884"></label>
<label>الحروف الإنجليزية<input id="en" value="BEV"></label>
</div>
<button onclick="save()">حفظ SVG</button>
</div>
<script>
const d={'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
function save(){const s=new XMLSerializer().serializeToString(document.getElementById('plate'));const b=new Blob([s],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='saudi-plate.svg';a.click()}
function update(){let n=document.getElementById('num').value.replace(/\D/g,'');document.getElementById('arabic-numbers').textContent=n.split('').map(x=>d[x]||x).join('');document.getElementById('latin-numbers').textContent=n;document.getElementById('arabic-letters').textContent=document.getElementById('ar').value;document.getElementById('latin-letters').textContent=document.getElementById('en').value.toUpperCase()}
['ar','num','en'].forEach(x=>document.getElementById(x).addEventListener('input',update));update();
</script></body></html>
