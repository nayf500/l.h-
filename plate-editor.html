<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة سعودية - نموذج موقع</title>
<style>
body{margin:0;background:#eee;font-family:Tahoma,Arial}.wrap{max-width:760px;margin:30px auto;background:#fff;padding:22px;border-radius:14px;text-align:center}
svg{width:100%;height:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}label{text-align:right;font-size:12px;font-weight:bold}input{width:100%;box-sizing:border-box;padding:10px;margin-top:4px;border:1px solid #bbb;border-radius:7px;text-align:center}button{background:#087549;color:#fff;border:0;border-radius:8px;padding:11px 20px;font-weight:bold}
</style><div class="wrap"><h2>لوحة سعودية — نموذج للموقع</h2><svg id="plate" viewBox="0 0 600 125" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9e9e7"/></linearGradient></defs>
<rect x="3" y="3" width="594" height="119" rx="7" fill="url(#metal)" stroke="#777" stroke-width="3"/><line x1="125" y1="4" x2="125" y2="121" stroke="#777"/><line x1="397" y1="4" x2="397" y2="121" stroke="#777"/>
<text id="an" x="62" y="57" text-anchor="middle" direction="rtl" font-family="Tahoma" font-size="34" font-weight="700">٨٨٤</text><text id="ln" x="62" y="91" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">884</text>
<g transform="translate(261 25)" fill="#111"><path d="M0 30C-12 21-23 20-32 23C-23 14-11 14 0 18C-8 8-6 2 0 0C6 2 8 8 0 18C11 14 23 14 32 23C23 20 12 21 0 30Z"/><path d="M-36 34L-4 24L-2 29L-32 39ZM36 34L4 24L2 29L32 39Z"/></g>
<text x="261" y="76" text-anchor="middle" font-family="Tahoma" font-size="10" font-weight="700">السعودية</text><text x="261" y="91" text-anchor="middle" font-family="Arial" font-size="8">KSA</text>
<text id="aa" x="493" y="57" text-anchor="middle" direction="rtl" font-family="Tahoma" font-size="34" font-weight="700">ع ع ب</text><text id="ee" x="493" y="91" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" letter-spacing="4">BEV</text>
<rect x="428" y="101" width="145" height="17" rx="3" fill="#d9a400"/><text x="500" y="114" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700">DEMO • WEBSITE</text>
</svg>
<div class="grid"><label>الأرقام<input id="n" value="884" maxlength="4"></label><label>الحروف العربية<input id="a" value="ع ع ب"></label><label>الحروف الإنجليزية<input id="e" value="BEV"></label></div>
<button onclick="download()">حفظ SVG</button></div>
<script>
const d={'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
function u(){let n=document.getElementById('n').value.replace(/\D/g,'').slice(0,4),a=document.getElementById('a').value,e=document.getElementById('e').value.toUpperCase();document.getElementById('an').textContent=n.split('').map(x=>d[x]||x).join('');document.getElementById('ln').textContent=n;document.getElementById('aa').textContent=a;document.getElementById('ee').textContent=e}
['n','a','e'].forEach(x=>document.getElementById(x).addEventListener('input',u));function download(){let s=new XMLSerializer().serializeToString(document.getElementById('plate'));let b=new Blob([s],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='saudi-plate-demo.svg';a.click()}
</script>
