<svg xmlns="http://www.w3.org/2000/svg" width="600" height="125" viewBox="0 0 600 125">
<defs>
 <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#e9e9e7"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".25"/></filter>
</defs>
<!-- DEMO / website mockup only -->
<rect x="3" y="3" width="594" height="119" rx="7" fill="url(#metal)" stroke="#777" stroke-width="3" filter="url(#shadow)"/>
<line x1="125" y1="4" x2="125" y2="121" stroke="#777" stroke-width="1.5"/>
<line x1="397" y1="4" x2="397" y2="121" stroke="#777" stroke-width="1.5"/>

<!-- Arabic numbers -->
<text x="62" y="57" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="34" font-weight="700" fill="#111">٨٨٤</text>
<text x="62" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111">884</text>

<!-- stylized two-swords/palm emblem for demo -->
<g transform="translate(261 25)" fill="#111">
 <path d="M0 30 C-12 21 -23 20 -32 23 C-23 14 -11 14 0 18 C-8 8 -6 2 0 0 C6 2 8 8 0 18 C11 14 23 14 32 23 C23 20 12 21 0 30Z"/>
 <path d="M-36 34 L-4 24 L-2 29 L-32 39 Z"/>
 <path d="M36 34 L4 24 L2 29 L32 39 Z"/>
</g>
<text x="261" y="76" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="10" font-weight="700">السعودية</text>
<text x="261" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="8">KSA</text>

<!-- Arabic letters -->
<text x="493" y="57" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="34" font-weight="700" fill="#111">ع ع ب</text>
<text x="493" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#111">BEV</text>

<!-- visible mockup marker -->
<g opacity=".78">
 <rect x="428" y="101" width="145" height="17" rx="3" fill="#d9a400"/>
